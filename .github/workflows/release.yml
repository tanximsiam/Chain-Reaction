name: Release

# Push a tag like v1.0.0 to build Windows and Linux binaries and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: ChainReaction-windows.exe
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distros
            asset: ChainReaction-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest test_board
      - run: pyinstaller --noconfirm ChainReaction.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/ChainReaction.exe ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist ChainReaction
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ChainReaction-windows.exe
            ChainReaction-linux.tar.gz
          generate_release_notes: true
